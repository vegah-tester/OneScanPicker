specVersion: "3.2"
metadata:
  name: onescanpicker.ui5
type: application
framework:
  name: SAPUI5
  version: "1.120.17"
  libraries:
    - name: sap.m
    - name: sap.f
    - name: sap.ui.core
    - name: sap.tnt
resources:
  configuration:
    paths:
      webapp: webapp
server:
  customMiddleware:
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /odata/v4/one-scan-picker
      configuration:
        baseUri: http://localhost:4004/odata/v4/one-scan-picker